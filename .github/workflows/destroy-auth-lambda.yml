name: Destruir Lambda de Autenticação (Terraform)

on:
  workflow_dispatch:

jobs:
  destroy-auth-lambda:
    name: Destruir Lambda de Autenticação
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configurar Arquivos de Variáveis
        run: |
          cd infra-auth
          echo 'account_id = "${{ secrets.AWS_ACCOUNT_ID }}"' > terraform.tfvars
          echo 'role_name  = "LabRole"' >> terraform.tfvars
          echo 'image_tag  = "destroy"' >> terraform.tfvars
          echo 'authorizer_image_tag = "destroy"' >> terraform.tfvars
          echo 'db_password = "${{ secrets.DB_PASSWORD }}"' >> terraform.tfvars
          echo 'jwt_secret  = "${{ secrets.JWT_SECRET }}"' >> terraform.tfvars

          echo 'bucket = "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"' > backend.hcl
          echo 'key    = "auth/terraform.tfstate"' >> backend.hcl
          echo 'region = "us-east-1"' >> backend.hcl

      - name: Terraform Init
        run: |
          cd infra-auth
          terraform init -backend-config=backend.hcl

      - name: Terraform Destroy
        run: |
          cd infra-auth
          terraform destroy -auto-approve