name: Destruir Clusters EKS (Terraform)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Cluster a destruir'
        required: true
        default: all
        type: choice
        options: [all, core, billing, stock, execution, notification]
  workflow_call:
    inputs:
      service:
        type: string
        default: all

jobs:
  destroy-eks:
    name: Destruir cluster ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.service == 'all' && '["core","billing","stock","execution","notification"]' || format('["{0}"]', inputs.service)) }}

    concurrency:
      group: eks-${{ matrix.service }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: eks/${{ matrix.service }}

    env:
      TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          repository: 15SOAT-FIAP/techchallenge-ofisy-eks-infra

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Descobrir Roles do EKS
        run: |
          EKS_CLUSTER_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksClusterRole')].RoleName" --output text)
          EKS_NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksNodeRole')].RoleName" --output text)
          echo "TF_VAR_eks_cluster_role=${EKS_CLUSTER_ROLE:-LabRole}" >> $GITHUB_ENV
          echo "TF_VAR_eks_node_role=${EKS_NODE_ROLE:-LabRole}" >> $GITHUB_ENV

      # Os NLBs sao criados pelo Kubernetes, fora do Terraform. Sem apagar os
      # Services LoadBalancer antes, o NLB fica orfao e trava o destroy da rede.
      # O delete so retorna depois que o controller remove o NLB (finalizer).
      - name: Remover Services LoadBalancer
        run: |
          CLUSTER="ms-ofisy-${{ matrix.service }}-cluster"
          if ! aws eks describe-cluster --name "$CLUSTER" > /dev/null 2>&1; then
            echo "Cluster $CLUSTER não existe, nada a remover."
            exit 0
          fi

          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER"
          kubectl get svc -A -o json \
            | jq -r '.items[] | select(.spec.type == "LoadBalancer") | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r NS NAME; do
                kubectl delete svc -n "$NS" "$NAME" --timeout=300s
              done

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=eks/${{ matrix.service }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve
          echo "### Cluster ${{ matrix.service }} destruído com sucesso" >> $GITHUB_STEP_SUMMARY
