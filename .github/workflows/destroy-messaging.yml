name: Destruir Mensageria SNS/SQS (Terraform)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  destroy-messaging:
    name: Destruir Mensageria SNS/SQS
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          repository: 15SOAT-FIAP/techchallenge-ofisy-eks-infra

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configurar Backend
        run: |
          cd messaging
          echo 'bucket = "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"' > backend.hcl
          echo 'key    = "messaging/terraform.tfstate"' >> backend.hcl
          echo 'region = "us-east-1"' >> backend.hcl

      - name: Terraform Init
        run: |
          cd messaging
          terraform init -backend-config=backend.hcl

      - name: Terraform Destroy
        run: |
          cd messaging
          terraform destroy -auto-approve
