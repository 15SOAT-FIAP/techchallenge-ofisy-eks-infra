name: Deploy API Gateway (Terraform)

on:
  workflow_dispatch:
    inputs:
      nlb_listener_arn:
        description: "ARN do Listener :8080 do NLB interno (ver comentário em variables.tf para o comando de obtenção)"
        required: true
        type: string
      auth_lambda_name:
        description: "Nome da Lambda de emissão de token via CPF/CNPJ"
        required: true
        type: string
        default: "ofisy-auth"
      auth_authorizer_lambda_name:
        description: "Nome da Lambda Authorizer (valida o token nas rotas protegidas)"
        required: true
        type: string
        default: "ofisy-auth-authorizer"

jobs:
  terraform-api-gateway:
    name: Provisionar API Gateway (Terraform)
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY
    
    concurrency:
      group: deploy-apigw
      cancel-in-progress: false

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validar Lambdas Existentes
        run: |
          aws lambda get-function --function-name "${{ inputs.auth_lambda_name }}" --region us-east-1 > /dev/null || {
            echo "Lambda ${{ inputs.auth_lambda_name }} não encontrada."
            echo "Rode a pipeline 'Deploy Lambda de Autenticação (Terraform)' antes dessa."
            exit 1
          }

          aws lambda get-function --function-name "${{ inputs.auth_authorizer_lambda_name }}" --region us-east-1 > /dev/null || {
            echo "Lambda ${{ inputs.auth_authorizer_lambda_name }} não encontrada."
            echo "Rode a pipeline 'Deploy Lambda de Autenticação (Terraform)' antes dessa."
            exit 1
          }

      - name: Configurar Arquivos de Variáveis
        run: |
          cd api-gateway

          echo 'nlb_listener_arn             = "${{ inputs.nlb_listener_arn }}"' > terraform.tfvars
          echo 'auth_lambda_name             = "${{ inputs.auth_lambda_name }}"' >> terraform.tfvars
          echo 'auth_authorizer_lambda_name  = "${{ inputs.auth_authorizer_lambda_name }}"' >> terraform.tfvars

          echo 'bucket = "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"' > backend.hcl
          echo 'key    = "api-gateway/terraform.tfstate"' >> backend.hcl
          echo 'region = "us-east-1"' >> backend.hcl

      - name: Terraform Init
        run: |
          cd api-gateway
          terraform init -backend-config=backend.hcl

      - name: Terraform Plan
        run: |
          cd api-gateway
          terraform plan -no-color > plan.txt
          cat plan.txt
          echo "### Planejamento do API Gateway" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        run: |
          cd api-gateway
          terraform apply -auto-approve

          GATEWAY_URL=$(terraform output -raw api_gateway_invoke_url)
          echo "### API Gateway Provisionado com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- URL: $GATEWAY_URL" >> $GITHUB_STEP_SUMMARY
