name: Terraform Plan Lambda de Autenticação (PR)

on:
  pull_request:
    paths:
      - 'infra-auth/**'
      - '.github/workflows/pr-plan-auth.yml'

jobs:
  terraform-plan-auth:
    name: Terraform Plan (Lambda de Autenticação)
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configurar Arquivos de Variáveis
        run: |
          cd infra-auth
          # A tag da imagem é ignorada pelo lifecycle da função; no plano de PR
          # serve apenas para satisfazer a variável obrigatória.
          echo 'account_id = "${{ secrets.AWS_ACCOUNT_ID }}"' > terraform.tfvars
          echo 'role_name  = "LabRole"' >> terraform.tfvars
          echo 'image_tag  = "pr-plan"' >> terraform.tfvars
          echo 'db_password = "${{ secrets.DB_PASSWORD }}"' >> terraform.tfvars
          echo 'jwt_secret  = "${{ secrets.JWT_SECRET }}"' >> terraform.tfvars

          echo 'bucket = "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"' > backend.hcl
          echo 'key    = "auth/terraform.tfstate"' >> backend.hcl
          echo 'region = "us-east-1"' >> backend.hcl

      - name: Terraform Init
        run: |
          cd infra-auth
          terraform init -backend-config=backend.hcl

      - name: Terraform Plan
        id: plan
        run: |
          cd infra-auth
          terraform plan -no-color > plan.txt

          echo "### Planejamento da Lambda de Autenticação (PR)" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comentar PR com Plan
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra-auth/plan.txt', 'utf8');
            const maxLen = 65000;
            const safePlan = plan.length > maxLen ? plan.substring(0, maxLen) + '\n...[TRUNCATED]' : plan;

            const output = `#### Terraform Plan - Lambda de Autenticação\n\n<details><summary>Mostrar detalhes do plano de execução</summary>\n\n\`\`\`terraform\n${safePlan}\n\`\`\`\n\n</details>\n\n*Ação rodada pelo commit ${context.sha}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });