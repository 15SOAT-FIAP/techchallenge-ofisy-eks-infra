name: Deploy Clusters EKS (Terraform)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Cluster a provisionar'
        required: true
        default: all
        type: choice
        options: [all, core, billing, stock, execution, notification]

jobs:
  terraform-eks:
    name: Provisionar cluster ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.service == 'all' && '["core","billing","stock","execution","notification"]' || format('["{0}"]', inputs.service)) }}

    concurrency:
      group: eks-${{ matrix.service }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: eks/${{ matrix.service }}

    env:
      TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Descobrir Roles do EKS
        run: |
          EKS_CLUSTER_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksClusterRole')].RoleName" --output text)
          EKS_NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksNodeRole')].RoleName" --output text)
          echo "TF_VAR_eks_cluster_role=${EKS_CLUSTER_ROLE:-LabRole}" >> $GITHUB_ENV
          echo "TF_VAR_eks_node_role=${EKS_NODE_ROLE:-LabRole}" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=eks/${{ matrix.service }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Plan
        run: |
          terraform plan -no-color > plan.txt
          cat plan.txt
          echo "### Planejamento do cluster ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve

          EKS_NAME=$(terraform output -raw eks_cluster_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "### Cluster ${{ matrix.service }} Provisionado com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster EKS: $EKS_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Repositório ECR: $ECR_URL" >> $GITHUB_STEP_SUMMARY
