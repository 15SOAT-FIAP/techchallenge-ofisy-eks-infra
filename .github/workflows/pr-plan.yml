name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'eks/**'
      - 'modules/**'
      - '.github/workflows/pr-plan.yml'

jobs:
  terraform-plan:
    name: Terraform Plan (${{ matrix.dir }})
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: infra
            key: eks/terraform.tfstate
          - dir: eks/core
            key: eks/core/terraform.tfstate
          - dir: eks/billing
            key: eks/billing/terraform.tfstate
          - dir: eks/stock
            key: eks/stock/terraform.tfstate
          - dir: eks/execution
            key: eks/execution/terraform.tfstate
          - dir: eks/notification
            key: eks/notification/terraform.tfstate

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    env:
      TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Garantir Bucket S3 do Terraform State
        run: |
          aws s3api head-bucket --bucket "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" 2>/dev/null || \
          aws s3api create-bucket --bucket "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" --region us-east-1 || echo "Bucket já existente ou criado."

      - name: Descobrir Roles do EKS
        run: |
          EKS_CLUSTER_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksClusterRole')].RoleName" --output text)
          EKS_NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksNodeRole')].RoleName" --output text)
          echo "TF_VAR_eks_cluster_role=${EKS_CLUSTER_ROLE:-LabRole}" >> $GITHUB_ENV
          echo "TF_VAR_eks_node_role=${EKS_NODE_ROLE:-LabRole}" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=${{ matrix.key }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Plan
        run: |
          terraform plan -no-color > plan.txt

          echo "### Planejamento de ${{ matrix.dir }} (PR)" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comentar PR com Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.dir }}/plan.txt', 'utf8');
            const maxLen = 65000;
            const safePlan = plan.length > maxLen ? plan.substring(0, maxLen) + '\n...[TRUNCATED]' : plan;

            const output = `#### Terraform Plan - ${{ matrix.dir }} ☁️\n\n<details><summary>Mostrar detalhes do plano de execução</summary>\n\n\`\`\`terraform\n${safePlan}\n\`\`\`\n\n</details>\n\n*Ação rodada pelo commit ${context.sha}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
